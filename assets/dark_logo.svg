<svg width="260" height="60" viewBox="0 0 260 60" xmlns="http://www.w3.org/2000/svg">

  <!-- Fond sombre étendu -->
  <rect width="260" height="60" fill="#020617"/>

  <!-- Cadre -->
  <rect width="260" height="60" rx="10" fill="none"/>

  <g transform="translate(20,5)">
    <!-- Maison -->
    <polyline 
      points="14,45 5,45 5,23 0,23 20,7 40,23 35,23 35,45 26,45"
      fill="none" 
      stroke="#00A8FF" 
      stroke-width="2"
      stroke-linejoin="round" 
      stroke-linecap="round"
    />

    <!-- Ampoule + éclair vectoriel -->
    <g transform="translate(8,10)">
      <!-- Ampoule (version originale avec arrondi discret) -->
      <path 
        d="M12 4
           C7.5 4 3.5 8 3.5 12
           C3.5 16.5 6 20.5 8 23
           A0.25 0.9 0 0 0 8.25 25.8
           H15.75
           A0.25 0.9 0 0 0 16 23
           C18 20.5 20.5 16.5 20.5 12
           C20.5 8 16.5 4 12 4 Z"
        fill="#FFC93C"
        stroke="#FFC93C"
        stroke-width="2"
      />

      <!-- Éclair vectoriel net -->
      <path 
        d="M12.5 5 L8.5 15 L11.5 15 L10 22 L16 12 L13 12 Z"
        fill="#020617"
        stroke="#020617"
        stroke-width="0.5"
      />

      <!-- Culot -->
      <rect x="8" y="28.3" width="8" height="3" rx="0.8"
            fill="#00A8FF" stroke="#00A8FF" stroke-width="2"/>

      <line x1="9" y1="29.1" x2="15" y2="29.1" stroke="#00A8FF" stroke-width="1"/>
      <line x1="9" y1="30.5" x2="15" y2="30.5" stroke="#00A8FF" stroke-width="1"/>

      <path 
        d="M9 34.2 A3.2 3.2 0 0 0 15 34.2 L9 34.2 Z"
        fill="#00A8FF" 
        stroke="#00A8FF" 
        stroke-width="2"
      />
    </g>
  </g>

  <!-- Texte -->
  <text x="90" y="40" fill="#00A8FF"
      font-family="Poppins, Arial, sans-serif"
      font-size="22" font-weight="600" letter-spacing="0.5">
    Fred' ELEC
  </text>

</svg>
